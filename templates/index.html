<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f1319;
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Left */
        #sidebar {
            width: 260px;
            background-color: #151a21;
            border-right: 1px solid #1e2630;
            display: flex;
            flex-direction: column;
            padding: 16px;
            flex-shrink: 0;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 24px;
            padding-left: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            text-decoration: none;
        }

        .nav-item:hover {
            background-color: #1e2630;
            color: #ffffff;
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .section-title {
            font-size: 0.75rem;
            color: #64748b;
            margin: 24px 0 12px 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .conversations {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-item {
            padding: 8px 12px;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }

        .chat-item:hover, .chat-item.active {
            background-color: #1e2630;
            color: #ffffff;
        }

        .sidebar-footer {
            border-top: 1px solid #1e2630;
            padding-top: 12px;
            margin-top: auto;
        }

        /* Main Area */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0f1319;
            position: relative;
        }

        /* Top Bar */
        #topbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid #151a21;
            flex-shrink: 0;
        }

        .top-btn {
            background-color: #1e2630;
            border: none;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .icon-group {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .icon-btn:hover {
            background-color: #1e2630;
            color: #ffffff;
        }

        /* Scrollable Chat Area */
        #chat-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-content {
            width: 100%;
            max-width: 768px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Welcome Screen */
        #welcome-box {
            text-align: center;
            margin: auto 0;
            padding: 40px 0;
        }

        #welcome-box h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        #welcome-box p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Messages Stream */
        #messages-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .msg-bubble {
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
        }

        .msg-bubble.user {
            background-color: #1e2630;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            max-width: 80%;
        }

        .msg-bubble.ai {
            background-color: #151a21;
            border: 1px solid #1e2630;
            color: #e2e8f0;
            align-self: flex-start;
            width: 100%;
        }

        /* Footer Fixed Input Area */
        #input-container {
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
            flex-shrink: 0;
        }

        .input-card {
            background-color: #1b2129;
            border: 1px solid #28313d;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .input-card textarea {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            resize: none;
            height: 52px;
            max-height: 160px;
            width: 100%;
            font-family: inherit;
        }

        .input-card textarea::placeholder {
            color: #64748b;
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plus-btn {
            background-color: #28313d;
            color: #94a3b8;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .plus-btn:hover {
            background-color: #333f4e;
            color: #ffffff;
        }

        .send-btn {
            background-color: #475569;
            color: #0f1319;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-btn.active {
            background-color: #ffffff;
        }

        .send-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .input-hint {
            text-align: center;
            color: #475569;
            font-size: 0.75rem;
            margin-top: 8px;
        }

        code {
            background-color: #0f1319;
            padding: 2px 6px;
            border-radius: 4px;
            color: #38bdf8;
            font-family: monospace;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e2630;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Sidebar Left -->
    <div id="sidebar">
        <div class="brand">EliteAI</div>
        
        <a href="#" class="nav-item" onclick="novoChat()">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            New chat
        </a>
        
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            Search
        </a>

        <div class="section-title">Conversations</div>
        <div class="conversations" id="conversations-list">
            <div id="no-convs" style="color: #64748b; font-size: 0.85rem; padding-left: 4px;">No conversations yet</div>
        </div>

        <div class="sidebar-footer">
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                API documentation
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main">
        <!-- Top Bar -->
        <div id="topbar">
            <div></div>
            <button class="top-btn">🌐 PT-BR</button>
            <div class="icon-group">
                <button class="icon-btn">⚙️</button>
                <button class="icon-btn">⎋</button>
            </div>
        </div>

        <!-- Chat Area (Scrollable) -->
        <div id="chat-scroll-area">
            <div class="chat-content">
                
                <div id="welcome-box">
                    <h1>EliteAI</h1>
                    <p>Faça perguntas, pesquise na web ou interaja com o sistema</p>
                </div>

                <div id="messages-list"></div>

            </div>
        </div>

        <!-- Fixed Bottom Input -->
        <div id="input-container">
            <div class="input-card">
                <textarea id="input" placeholder="Digite uma mensagem..." oninput="checkInput()" onkeydown="handleKeyDown(event)"></textarea>
                <div class="input-actions">
                    <button class="plus-btn">+</button>
                    <button id="send-btn" class="send-btn" onclick="enviar()">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 4l-8 8h5v8h6v-8h5z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="input-hint">Enter para enviar · Shift+Enter para nova linha</div>
        </div>
    </div>

    <script>
        let chatCriado = false;

        function checkInput() {
            const input = document.getElementById("input");
            const btn = document.getElementById("send-btn");
            if (input.value.trim().length > 0) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviar();
            }
        }

        function formatar(texto) {
            if (!texto) return "";
            texto = texto.replace(/`([^`]+)`/g, '<code>$1</code>');
            texto = texto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            texto = texto.replace(/\*(.*?)\*/g, '<em>$1</em>');
            texto = texto.replace(/\n/g, '<br>');
            return texto;
        }

        function rolarAteOFinal() {
            const area = document.getElementById("chat-scroll-area");
            area.scrollTop = area.scrollHeight;
        }

        function adicionarChatNaSidebar(primeiraMensagem) {
            const list = document.getElementById("conversations-list");
            const noConvs = document.getElementById("no-convs");
            if (noConvs) noConvs.remove();

            const titulo = primeiraMensagem.length > 22 ? primeiraMensagem.substring(0, 22) + "..." : primeiraMensagem;

            const item = document.createElement("div");
            item.className = "chat-item active";
            item.textContent = titulo;
            
            // Remove 'active' dos outros
            document.querySelectorAll(".chat-item").forEach(el => el.classList.remove("active"));
            
            list.prepend(item);
        }

        function novoChat() {
            document.getElementById("messages-list").innerHTML = "";
            document.getElementById("welcome-box").style.display = "block";
            chatCriado = false;
            document.querySelectorAll(".chat-item").forEach(el => el.classList.remove("active"));
        }

        async function enviar() {
            const input = document.getElementById("input");
            const messagesList = document.getElementById("messages-list");
            const welcomeBox = document.getElementById("welcome-box");

            const msg = input.value.trim();
            if (!msg) return;

            welcomeBox.style.display = "none";

            // Se for a primeira mensagem, cria o item na barra lateral
            if (!chatCriado) {
                adicionarChatNaSidebar(msg);
                chatCriado = true;
            }

            // Adiciona mensagem do usuário
            messagesList.innerHTML += `
                <div class="msg-bubble user">${msg}</div>
            `;

            input.value = "";
            checkInput();
            rolarAteOFinal();

            // Adiciona indicador de carregamento
            const loadingId = "loading-" + Date.now();
            messagesList.innerHTML += `
                <div id="${loadingId}" class="msg-bubble ai" style="color: #64748b;">
                    Pensando...
                </div>
            `;
            rolarAteOFinal();

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ mensagem: msg })
                });

                const dados = await res.json();
                
                document.getElementById(loadingId).outerHTML = `
                    <div class="msg-bubble ai">${formatar(dados.resposta)}</div>
                `;
            } catch (e) {
                document.getElementById(loadingId).outerHTML = `
                    <div class="msg-bubble ai" style="color: #ef4444;">
                        Erro de conexão com o servidor.
                    </div>
                `;
            }

            rolarAteOFinal();
            input.focus();
        }
    </script>
</body>
</html>
